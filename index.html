<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FlipKart</title>
</head>
<body>
    <header>
        <div class="header">
            <div class="image">
                <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003401_1715928842_Screenshot%202024-05-17%20122003.png" alt="logo">
            </div>
            <form class="search-box">
                <input type="search" placeholder="Search...">
                <button type="submit">Search</button>
            </form>
            <nav>
                <button type="submit">Login</button>
                <button type="submit">Cart</button>
            </nav>
        </div>
    </header>
    <div class="main-items">
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003402_1715928861_29327f40e9c4d26b.png" alt="Grocery">
            <h5>Grocery</h5>
        </div>
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003403_1715928872_22fddf3c7da4c4f4.png" alt="Mobile">
            <h5>Mobile</h5>
        </div>
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003404_1715928884_0d75b34f7d8fbcb3.png" alt="Mobile">
            <h5>Faishion</h5>
        </div>
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003405_1715928894_69c6589653afdb9a.png" alt="Mobile">
            <h5>Electronics</h5>
        </div>
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003406_1715928906_ab7e2b022a4587dd.png" alt="Mobile">
            <h5>Furniture</h5>
        </div>
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003407_1715928915_0139228b2f7eb413.png" alt="Mobile">
            <h5>Appliances</h5>
        </div>
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003408_1715928928_71050627a56b4693.png" alt="Mobile">
            <h5>Travel</h5>
        </div>
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003409_1715928939_dff3f7adcf3a90c6.png" alt="Mobile">
            <h5>Beauty,Toys</h5>
        </div>
        <div class="image">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003410_1715928949_05d708653beff580.png" alt="Mobile">
            <h5>Two Wheeler</h5>
        </div>
    </div>
    <div class="fly-india">
        <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003411_1715928965_4227babcdcb113c8.png" alt="fly">
    </div>
    <div class="main-img">
        <div class="im">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003412_1715928976_22e305bf45e2e1a2.png" alt="discount">
        </div>
        <div class="im">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003413_1715928986_6537e82f357a7f59.png" alt="card">
        </div>
        <div class="im">
         <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003414_1715928997_c9f829023c573ba8.png" alt="peak-summer">
        </div>
    </div>
    <h3>Top Deals</h3>
    <div class="top-deals">
        <div class="img">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003415_1715929006_l.png" alt="">
            <p>NB Shoes 80% off</p>
        </div>
        <div class="img">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003416_1715929017_k.png" alt="">
            <p>Addidas Runner</p>
        </div>
        <div class="img">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003417_1715929027_d.png" alt="">
            <p>US Polo Denmark</p>
        </div>
        <div class="img">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003418_1715929035_t.png" alt="">
            <p>Rolex Watch</p>
        </div>
        <div class="img">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003419_1715929047_s.png" alt="">
            <p>Cargo 20% off</p>
        </div>
        <div class="img">
            <img src="https://ninjasfiles.s3.amazonaws.com/asset_0000000000003420_1715929057_a.png" alt="">
            <p>NB Collections</p>
        </div>
        
    </div>
</body>
</html>
